timezone: Asia/Jakarta
orchestrator:
  maxConcurrentTasks: 1
  pollingIntervalSeconds: 60
  leaseDurationSeconds: 300
  heartbeatIntervalSeconds: 60
  shutdownGracePeriodSeconds: 30
  usageLimitPauseMinutes: 30
  http:
    host: 127.0.0.1
    port: 8089
    # Prometheus metrics at GET /metrics.
    metrics: true
  execution:
    # Phase 4: prepare isolated worktrees for claimed tasks. Requires `workspace` and `repositories`.
    prepareWorkspaces: false
    # Phase 5: analyze, implement, run quality gates, fix, and review in those worktrees, then park a reviewed local
    # branch. Requires `prepareWorkspaces`, `agents`, and `quality.checks` for every repository. Never pushes.
    runAgents: false
    # Phase 6: push reviewed branches, open one pull request per repository, observe required checks, reviews, and
    # merges, and synchronize Linear. Requires `runAgents`, `delivery`, and GITHUB_TOKEN. Never merges. Read the README's
    # delivery trust boundary before enabling it in production.
    deliver: false
  # Delivery states (PR_CREATED, WAITING_CI, READY_FOR_HUMAN_REVIEW) use their own claim limit.
  maxConcurrentDeliveryTasks: 2
  # Canary controls for starting new tasks; unset means no restriction.
  # rollout:
  #   repositories: [web]
  #   maxNewTasksPerDay: 2
schedule:
  enabled: true
  allowMechanicalOperationsOutsideHours: true
  finishCurrentStep: true
  startNewStepIfRemainingMinutesAtLeast: 20
  minimumRemainingMinutesForNewTask: 45
  minimumRemainingMinutesForAnalysis: 20
  minimumRemainingMinutesForImplementation: 45
  minimumRemainingMinutesForReview: 20
  days:
    monday: { enabled: true, windows: [{ start: "08:00", end: "12:00" }, { start: "13:00", end: "18:00" }] }
    tuesday: { enabled: true, windows: [{ start: "08:00", end: "18:00" }] }
    wednesday: { enabled: true, windows: [{ start: "08:00", end: "18:00" }] }
    thursday: { enabled: true, windows: [{ start: "08:00", end: "18:00" }] }
    friday: { enabled: true, windows: [{ start: "08:00", end: "17:00" }] }
    saturday: { enabled: false, windows: [] }
    sunday: { enabled: false, windows: [] }
linear:
  teamKey: KEL
  requiredLabels: [ai-ready]
  excludedLabels: [human-only, blocked]
  apiUrl: https://api.linear.app/graphql
  requestTimeoutMs: 10000
  maxRetries: 3
models:
  analyzer: { tier: terra, effort: high }
  reviewer: { tier: terra, effort: high }
  tiers:
    luna: { model: configurable-luna-model }
    terra: { model: configurable-terra-model }
    sol: { model: configurable-sol-model }
  # Which executable runs a model, addressed by alias. A model name is free-form, so any provider works as long as an
  # adapter exists for its `kind`; capabilities come from the adapter, never from this file.
  #
  # With a single provider configured, every tier uses it and no tier needs to name one. With several, each reachable
  # tier must name its provider, so no attempt is ever routed by guesswork. `environment` lists the extra variables that
  # reach that provider only; orchestrator credentials (DATABASE_URL, LINEAR_API_KEY, operator token) are always refused.
  #
  # `effort` renames the canonical levels (low, medium, high, max) to whatever the provider calls them. Leaving it out
  # uses the adapter's own defaults.
  #
  # providers:
  #   codex:
  #     kind: codex-cli
  #     executable: /usr/local/bin/codex
  #     environment: [CODEX_HOME, OPENAI_API_KEY]
  #     effort: { max: xhigh }
  #
  # Routing is data too: `routes` overrides which tier and effort a complexity uses, `escalation` overrides the retry
  # ladder that a complexity walks on repeated failure, and `roles` pins one role to its own tier. Anything left out
  # keeps the documented default. Analyzer and reviewer always need a tier; implementer and fixer follow the escalation
  # ladder unless `roles` pins them.
  #
  # routes:
  #   medium: { tier: terra, effort: high }
  # escalation:
  #   medium: [{ tier: terra, effort: medium }, { tier: sol, effort: high }]
  # roles:
  #   implementer: { tier: terra, effort: high }
  #   fixer: { tier: sol, effort: high }
limits:
  maxImplementationAttempts: 4
  maxQualityFixAttempts: 3
  maxReviewCycles: 3
# Optional until prepareWorkspaces is enabled. Workspace releases for terminal tasks run whenever `workspace` is set.
# workspace:
#   root: /var/lib/ai-orchestrator/workspaces
#   minimumFreeDiskMb: 2048
#   gitTimeoutSeconds: 300
#   repositoryLockTimeoutSeconds: 600
#   remoteRetryMinutes: 5
#   # github-token: fetch and push with GITHUB_TOKEN only, never host credential files. Required for production delivery.
#   gitAuthentication: github-token
# Quality commands are trusted argument arrays run in the worktree without a shell. They execute agent-written code, so
# they receive no credentials; list extra variable names under `quality.environment` only when a command needs them.
# A check fails only on a non-zero exit: a formatter must use a check mode that exits non-zero (`gofmt -l` does not).
# repositories:
#   web:
#     path: /srv/kelolakelas/kelolakelas-web
#     github: kelolakelas/kelolakelas-web
#     remote: origin
#     baseBranch: main
#     # Leased execution tasks touching this repository across all workers.
#     maxConcurrentTasks: 1
#     quality:
#       setup: [{ name: install, command: [npm, ci], timeoutSeconds: 900 }]
#       checks:
#         - { name: typecheck, command: [npx, tsc, --noEmit] }
#         - { name: lint, command: [npm, run, lint] }
#         - { name: test, command: [npm, test] }
#       documentation: [docs/components/web.md]
#   api-gateway:
#     path: /srv/kelolakelas/kelolakelas-api-gateway
#     github: kelolakelas/kelolakelas-api-gateway
#     quality: &go-quality
#       setup: [{ name: modules, command: [go, mod, download] }]
#       checks:
#         - { name: vet, command: [go, vet, ./...] }
#         - { name: test, command: [go, test, -race, -count=1, ./...], timeoutSeconds: 1800 }
#         - { name: build, command: [go, build, ./...] }
#   academic: { path: /srv/kelolakelas/kelolakelas-academic-service, github: kelolakelas/kelolakelas-academic-service, quality: *go-quality }
#   identity: { path: /srv/kelolakelas/kelolakelas-identity-service, github: kelolakelas/kelolakelas-identity-service, quality: *go-quality }
#   billing: { path: /srv/kelolakelas/kelolakelas-billing-service, github: kelolakelas/kelolakelas-billing-service, quality: *go-quality }
# Required when runAgents is true. Every routed model tier (luna, terra, sol) must be configured under models.tiers.
# Deprecated in favour of models.providers: this block still works and supplies a single provider named after its `kind`,
# but it cannot describe more than one provider. Listing every routed provider in models.providers is preferred.
