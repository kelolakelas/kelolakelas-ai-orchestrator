#   maxReviewDiffBytes: 200000
# Required when deliver is true.
# delivery:
#   github: { apiUrl: https://api.github.com, requestTimeoutMs: 15000, maxRetries: 3 }
#   pollIntervalSeconds: 120
#   retryIntervalSeconds: 300
#   # A required check still missing or pending this long after the pull request head appeared blocks the task.
#   requiredChecksTimeoutMinutes: 180
#   draftPullRequests: false
