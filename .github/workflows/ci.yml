name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `gate` is the required status check protecting `main`. Keep the job name stable; renaming it silently removes the
  # merge gate until branch protection is updated.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_orchestrator
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_orchestrator
      MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reject schema changes without a committed migration
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain -- migrations)" ]; then
            git status --porcelain -- migrations
            echo "::error::src/db/schema.ts differs from migrations/. Run 'npm run db:generate' and commit the result."
            exit 1
          fi
      - run: npm run test:migrations
      - run: npm run db:migrate
      - run: npm run test:repository
      - run: npm run build
      - run: npm run lint
      - run: npm test
